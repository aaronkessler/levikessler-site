<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levi Kessler</title>
<meta name="description" content="Levi's website — games and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1030'/%3E%3Crect x='3' y='3' width='10' height='11' fill='%236e4528'/%3E%3Crect x='5' y='5' width='6' height='5' fill='%23d8b48a'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23111'/%3E%3Crect x='9' y='6' width='1' height='1' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root{--sky1:#0b1030;--sky2:#2b2f6b;--sky3:#5a3f7a;--gold:#ffcc33;--ink:#fff;--muted:rgba(255,255,255,.75)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:"Fredoka",system-ui,-apple-system,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);min-height:100vh;overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{position:absolute;width:3px;height:3px;background:#fff;opacity:.8;animation:tw 3s infinite ease-in-out}
  @keyframes tw{50%{opacity:.2}}
  .moon{position:fixed;top:28px;right:6%;width:44px;height:44px;background:#fff6c9;box-shadow:0 0 40px 8px rgba(255,246,201,.25);z-index:0}
  main{position:relative;z-index:2;width:100%;max-width:640px;padding:72px 22px 220px;text-align:center}
  h1{font-size:clamp(44px,11vw,76px);line-height:1;margin:0 0 10px;letter-spacing:1px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  .hi{font-size:20px;color:var(--muted);margin:0 0 44px}
  .card{background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25);border-radius:22px;padding:22px;backdrop-filter:blur(4px);
    display:flex;gap:20px;align-items:center;text-align:left}
  .card svg{flex:0 0 auto;width:112px;height:112px;image-rendering:pixelated}
  .card h2{margin:0 0 6px;font-size:26px}
  .card p{margin:0 0 16px;color:var(--muted);font-size:16px;line-height:1.4}
  .play{display:inline-block;background:var(--gold);color:#3a2a10;font-weight:700;font-size:19px;text-decoration:none;
    padding:12px 22px;border-radius:30px;box-shadow:0 5px 0 #b8861a;transition:transform .08s,box-shadow .08s}
  .play:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b8861a}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 #b8861a}
  .soon{margin-top:18px;color:var(--muted);font-size:15px}
  .forest{position:fixed;left:0;right:0;bottom:32px;height:170px;z-index:1;pointer-events:none}
  footer{position:fixed;left:0;right:0;bottom:0;z-index:2;background:#0a1512;text-align:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));color:rgba(255,255,255,.6);font-size:13px}
  @media (max-width:480px){.moon{top:18px;right:18px;width:34px;height:34px}main{padding-top:84px}.card{flex-direction:column;text-align:center}.card svg{width:96px;height:96px}}
  @media (prefers-reduced-motion:reduce){.stars i{animation:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<main>
  <h1>Levi Kessler</h1>
  <p class="hi">Welcome to my website! 👋</p>
  <div class="card">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <rect x="2" y="2" width="12" height="13" fill="#6e4528"/>
      <rect x="1" y="7" width="2" height="6" fill="#6e4528"/><rect x="13" y="7" width="2" height="6" fill="#6e4528"/>
      <rect x="2" y="3" width="12" height="1" fill="#4b2e18"/>
      <rect x="4" y="4" width="8" height="6" fill="#d8b48a"/>
      <rect x="5" y="5" width="2" height="2" fill="#fff27a"/><rect x="9" y="5" width="2" height="2" fill="#fff27a"/>
      <rect x="6" y="5" width="1" height="1" fill="#111"/><rect x="10" y="5" width="1" height="1" fill="#111"/>
      <rect x="7" y="8" width="2" height="1" fill="#4b2e18"/>
      <rect x="5" y="11" width="6" height="2" fill="#4b2e18"/>
    </svg>
    <div>
      <h2>Bigfoot Blockwoods</h2>
      <p>You're a Sasquatch in a world made of blocks. Sneak past the ranger, grab the campers' snacks, and get home before sunrise!</p>
      <a class="play" href="https://bigfoot.levikessler.com">Play now →</a>
    </div>
  </div>
  <p class="soon">More games coming soon…</p>
</main>
<svg class="forest" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true" id="forest"></svg>
<footer>Made by Levi (with a little help from Dad)</footer>
<script>
  // stars
  const s=document.getElementById('stars');
  for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.top=Math.random()*60+'%';
    e.style.animationDelay=(Math.random()*3)+'s';if(Math.random()<.3){e.style.width=e.style.height='2px';}s.appendChild(e);}
  // blocky pine forest
  const f=document.getElementById('forest');let svg='';
  const tree=(x,h,c)=>{const w=40;let t=`<rect x="${x+w/2-6}" y="${200-24}" width="12" height="24" fill="#2a1a10"/>`;
    for(let k=0;k<4;k++){const tw=w-k*8,ty=200-24-(k+1)*h/4;t+=`<rect x="${x+(w-tw)/2}" y="${ty}" width="${tw}" height="${h/4+1}" fill="${c}"/>`;}return t;};
  for(let x=-20;x<1260;x+=34+Math.random()*20)svg+=tree(x,90+Math.random()*60,'#152a24');
  for(let x=-10;x<1260;x+=46+Math.random()*30)svg+=tree(x,60+Math.random()*50,'#0e1d19');
  svg+=`<rect x="0" y="190" width="1200" height="10" fill="#0a1512"/>`;
  f.innerHTML=svg;
</script>
</body>
</html>
